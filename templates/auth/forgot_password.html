{% extends "layout_modern.html" %}

{% block title %}Account Recovery | OncoBloom{% endblock %}

{% block content %}
<div class="row w-100 m-0 h-100 justify-content-center align-items-center">
    <div class="col-md-8 col-lg-6 col-xl-5 p-4">
        
        <div class="card shadow-lg border-0" style="border-radius: 20px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-qrcode fa-3x mb-3" style="color: #8a79ab;"></i>
                    <h2 class="fw-bold" style="color: #3a2d5f;">Account Recovery</h2>
                    <p class="text-muted">Enter your username and your Recovery Key, or scan your saved QR code.</p>
                </div>
                
                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <div class="mb-4">
                        <label for="username" class="form-label text-muted fw-bold small text-uppercase">
                            Username
                        </label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="recovery_key" class="form-label text-muted fw-bold small text-uppercase d-flex justify-content-between">
                            <span>Recovery Key</span>
                            <a href="#" id="start-scanner" class="text-decoration-none" style="color: #e6a5b8;">
                                <i class="fas fa-camera"></i> Scan QR
                            </a>
                        </label>
                        <input type="text" class="form-control form-control-lg text-monospace" id="recovery_key" name="recovery_key" placeholder="OB-XXXX-XXXX" required>
                    </div>

                    <div id="qr-reader" class="mb-4" style="display: none; border-radius: 12px; overflow: hidden; border: 2px solid #8a79ab;"></div>
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-lg" style="background: linear-gradient(135deg, #6b5f8a 0%, #8a79ab 100%); color: white; border-radius: 12px; font-weight: 600;">
                            Verify Key & Reset Password <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-0">
                        <a href="{{ url_for('login') }}" class="text-decoration-none" style="color: #6b5f8a; font-weight: 600;">
                            <i class="fas fa-arrow-left me-1"></i> Back to Login
                        </a>
                    </p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const startScannerBtn = document.getElementById("start-scanner");
        const qrReader = document.getElementById("qr-reader");
        const recoveryInput = document.getElementById("recovery_key");
        let html5QrcodeScanner = null;

        startScannerBtn.addEventListener("click", function(e) {
            e.preventDefault();
            
            if (qrReader.style.display === "block") {
                // If already open, close it
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.clear();
                }
                qrReader.style.display = "none";
                startScannerBtn.innerHTML = '<i class="fas fa-camera"></i> Scan QR';
                return;
            }

            qrReader.style.display = "block";
            startScannerBtn.innerHTML = '<i class="fas fa-times"></i> Close Scanner';

            html5QrcodeScanner = new Html5QrcodeScanner(
                "qr-reader", 
                { fps: 10, qrbox: {width: 250, height: 250} },
                /* verbose= */ false
            );
            
            html5QrcodeScanner.render(function(decodedText) {
                // On success scan
                recoveryInput.value = decodedText;
                
                // Close scanner
                html5QrcodeScanner.clear();
                qrReader.style.display = "none";
                startScannerBtn.innerHTML = '<i class="fas fa-camera"></i> Scan QR';
                
                // Show toast
                if(window.showToastPopup) {
                    window.showToastPopup('success', 'QR Code scanned successfully!');
                }
            }, function(error) {
                // scanning...
            });
        });
    });
</script>
{% endblock %}
