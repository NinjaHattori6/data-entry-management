{% extends "layout_modern.html" %}

{% block title %}Set New Password | OncoBloom{% endblock %}

{% block content %}
<div class="row w-100 m-0 h-100 justify-content-center align-items-center">
    <div class="col-md-8 col-lg-6 col-xl-5 p-4">
        
        <div class="card shadow-lg border-0" style="border-radius: 20px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-lock fa-3x mb-3" style="color: #8a79ab;"></i>
                    <h2 class="fw-bold" style="color: #3a2d5f;">Set New Password</h2>
                    <p class="text-muted">Recovery key verified. Please set a new password for <strong>{{ session.get('reset_username') }}</strong>.</p>
                </div>
                
                <form method="POST" action="{{ url_for('reset_password') }}">
                    <div class="mb-4 position-relative">
                        <label for="password" class="form-label text-muted fw-bold small text-uppercase">
                            New Password
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" minlength="6" required>
                        <i class="fas fa-eye position-absolute ob-pw-toggle" style="right: 15px; top: 48px; cursor: pointer; color: #a09aad;" id="togglePassword"></i>
                        <div class="form-text mt-2"><i class="fas fa-info-circle me-1"></i> Minimum 6 characters</div>
                    </div>
                    
                    <div class="mb-4 position-relative">
                        <label for="confirm_password" class="form-label text-muted fw-bold small text-uppercase">
                            Confirm New Password
                        </label>
                        <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" minlength="6" required>
                        <i class="fas fa-eye position-absolute ob-pw-toggle" style="right: 15px; top: 48px; cursor: pointer; color: #a09aad;" id="toggleConfirmPassword"></i>
                    </div>
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-lg" style="background: linear-gradient(135deg, #6b5f8a 0%, #8a79ab 100%); color: white; border-radius: 12px; font-weight: 600;">
                            Update Password <i class="fas fa-check-circle ms-2"></i>
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-0">
                        <a href="{{ url_for('login') }}" class="text-decoration-none" style="color: #6b5f8a; font-weight: 600;">
                            <i class="fas fa-times me-1"></i> Cancel Reset
                        </a>
                    </p>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Password toggles
    const togglePw = document.getElementById('togglePassword');
    const pwInput = document.getElementById('password');
    if (togglePw) {
        togglePw.addEventListener('click', () => {
            const type = pwInput.getAttribute('type') === 'password' ? 'text' : 'password';
            pwInput.setAttribute('type', type);
            togglePw.classList.toggle('fa-eye');
            togglePw.classList.toggle('fa-eye-slash');
        });
    }

    const toggleConfirmPw = document.getElementById('toggleConfirmPassword');
    const confirmPwInput = document.getElementById('confirm_password');
    if (toggleConfirmPw) {
        toggleConfirmPw.addEventListener('click', () => {
            const type = confirmPwInput.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPwInput.setAttribute('type', type);
            toggleConfirmPw.classList.toggle('fa-eye');
            toggleConfirmPw.classList.toggle('fa-eye-slash');
        });
    }
});
</script>
{% endblock %}
